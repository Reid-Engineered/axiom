name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  frontend-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test

      - name: Check for hardcoded design values
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -rEn '#[0-9a-fA-F]{3,6}|rgba\(' src/ \
            --include='*.ts' --include='*.tsx' --include='*.css' \
            --exclude='tokens.css' || true)
          if [ -n "$matches" ]; then
            echo "Hardcoded design values found outside src/styles/tokens.css:"
            echo "$matches"
            exit 1
          fi
          echo "No hardcoded design values found."

  backend-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo check
      - run: cargo test
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo fmt --all --check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install WebKit driver + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb \
            || sudo apt-get install -y webkitgtk-webdriver xvfb

      - run: npm ci
      - run: npm run test:e2e:linux
